<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Bookings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        /* ================= HEADER ================= */

        header {
            background-color: #6a1b9a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        /* ================= BACK BUTTON ================= */

        .back-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .back-btn:hover {
            background-color: #333;
        }

        /* ================= STAT CARDS ================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat-card {
            background-color: white;
            padding: 20px 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            border-top: 5px solid #6a1b9a;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #6a1b9a;
            margin-bottom: 5px;
        }

        .stat-title {
            color: #666;
            font-size: 13px;
        }

        /* Pending */

        .pending-stat {
            border-top-color: #f0ad00;
        }

        .pending-stat .stat-number {
            color: #856404;
        }

        /* Approved */

        .approved-stat {
            border-top-color: #2e7d32;
        }

        .approved-stat .stat-number {
            color: #155724;
        }

        /* Rejected */

        .rejected-stat {
            border-top-color: #d32f2f;
        }

        .rejected-stat .stat-number {
            color: #721c24;
        }

        /* Completed */

        .completed-stat {
            border-top-color: #0288d1;
        }

        .completed-stat .stat-number {
            color: #0c5460;
        }

        /* ================= BOOKING CARD ================= */

        .booking-card {
            background-color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .booking-card h3 {
            color: #6a1b9a;
            margin-top: 0;
        }

        .booking-card p {
            line-height: 1.5;
        }

        /* ================= STATUS ================= */

        .status {
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 5px;
            display: inline-block;
        }

        .pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .approved {
            background-color: #d4edda;
            color: #155724;
        }

        .rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .completed {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        /* ================= DELETE BUTTON ================= */

        .delete-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .container {
                width: 94%;
                padding: 10px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 24px;
            }

        }

        @media (max-width: 450px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <h1>
        📋 Manage Rental Bookings
    </h1>

</header>


<div class="container">


    <!-- ================= BACK ================= -->

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Admin Dashboard

    </button>


    <!-- ================================================= -->
    <!-- OVERALL BOOKING COUNT CARDS -->
    <!-- ================================================= -->

    <div class="stats-grid">


        <!-- TOTAL BOOKINGS -->

        <div class="stat-card">

            <div class="stat-icon">
                📋
            </div>

            <div
                class="stat-number"
                id="totalBookings">

                0

            </div>

            <div class="stat-title">
                Total Bookings
            </div>

        </div>


        <!-- PENDING -->

        <div class="stat-card pending-stat">

            <div class="stat-icon">
                ⏳
            </div>

            <div
                class="stat-number"
                id="pendingBookings">

                0

            </div>

            <div class="stat-title">
                Pending
            </div>

        </div>


        <!-- APPROVED -->

        <div class="stat-card approved-stat">

            <div class="stat-icon">
                ✅
            </div>

            <div
                class="stat-number"
                id="approvedBookings">

                0

            </div>

            <div class="stat-title">
                Approved
            </div>

        </div>


        <!-- REJECTED -->

        <div class="stat-card rejected-stat">

            <div class="stat-icon">
                ❌
            </div>

            <div
                class="stat-number"
                id="rejectedBookings">

                0

            </div>

            <div class="stat-title">
                Rejected
            </div>

        </div>


        <!-- COMPLETED -->

        <div class="stat-card completed-stat">

            <div class="stat-icon">
                🎉
            </div>

            <div
                class="stat-number"
                id="completedBookings">

                0

            </div>

            <div class="stat-title">
                Completed
            </div>

        </div>

    </div>


    <!-- ================= TITLE ================= -->

    <h2>
        All Rental Bookings
    </h2>


    <!-- ================= BOOKING LIST ================= -->

    <div id="bookingList">

        <p>
            Loading bookings...
        </p>

    </div>


</div>


<script>

    const API_URL =
        "http://localhost:8081";


    // =================================================
    // LOAD ALL BOOKINGS
    // =================================================

    async function loadBookings() {

        const bookingList =
            document.getElementById(
                "bookingList"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/api/rentals`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load bookings"
                );

            }


            const bookings =
                await response.json();


            console.log(
                "All Bookings:",
                bookings
            );


            // ==========================================
            // CALCULATE COUNTS
            // ==========================================

            let total = bookings.length;

            let pending = 0;

            let approved = 0;

            let rejected = 0;

            let completed = 0;


            bookings.forEach(
                function(booking) {

                    const status =
                        String(
                            booking.status ||
                            "PENDING"
                        )
                        .trim()
                        .toUpperCase();


                    if (status === "PENDING") {

                        pending++;

                    }

                    else if (
                        status === "APPROVED"
                    ) {

                        approved++;

                    }

                    else if (
                        status === "REJECTED"
                    ) {

                        rejected++;

                    }

                    else if (
                        status === "COMPLETED"
                    ) {

                        completed++;

                    }

                }
            );


            // ==========================================
            // DISPLAY COUNTS
            // ==========================================

            document.getElementById(
                "totalBookings"
            ).innerText =
                total;


            document.getElementById(
                "pendingBookings"
            ).innerText =
                pending;


            document.getElementById(
                "approvedBookings"
            ).innerText =
                approved;


            document.getElementById(
                "rejectedBookings"
            ).innerText =
                rejected;


            document.getElementById(
                "completedBookings"
            ).innerText =
                completed;


            // ==========================================
            // DISPLAY BOOKINGS
            // ==========================================

            bookingList.innerHTML = "";


            if (
                !bookings ||
                bookings.length === 0
            ) {

                bookingList.innerHTML = `

                    <div class="booking-card">

                        <p>
                            No bookings found.
                        </p>

                    </div>

                `;

                return;

            }


            // ==========================================
            // CREATE BOOKING CARDS
            // ==========================================

            bookings.forEach(
                function(booking) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "booking-card";


                    const status =
                        String(
                            booking.status ||
                            "PENDING"
                        )
                        .trim()
                        .toUpperCase();


                    let statusClass =
                        "pending";


                    if (
                        status === "APPROVED"
                    ) {

                        statusClass =
                            "approved";

                    }

                    else if (
                        status === "REJECTED"
                    ) {

                        statusClass =
                            "rejected";

                    }

                    else if (
                        status === "COMPLETED"
                    ) {

                        statusClass =
                            "completed";

                    }


                    card.innerHTML = `

                        <h3>
                            📋 Booking #${booking.id}
                        </h3>

                        <p>
                            <strong>User ID:</strong>
                            ${booking.userId}
                        </p>

                        <p>
                            <strong>Equipment ID:</strong>
                            ${booking.equipmentId}
                        </p>

                        <p>
                            <strong>Start Date:</strong>
                            ${booking.startDate}
                        </p>

                        <p>
                            <strong>End Date:</strong>
                            ${booking.endDate}
                        </p>

                        <p>
                            <strong>Total Amount:</strong>
                            ₹${booking.totalAmount}
                        </p>

                        <p>

                            <strong>Status:</strong>

                            <span
                                class="status ${statusClass}">

                                ${status}

                            </span>

                        </p>


                        <button
                            class="delete-btn"
                            onclick="deleteBooking(${booking.id})">

                            🗑️ Delete

                        </button>

                    `;


                    bookingList.appendChild(
                        card
                    );

                }
            );

        }


        catch (error) {

            console.error(
                "Booking Error:",
                error
            );


            // Reset counts

            document.getElementById(
                "totalBookings"
            ).innerText = "0";


            document.getElementById(
                "pendingBookings"
            ).innerText = "0";


            document.getElementById(
                "approvedBookings"
            ).innerText = "0";


            document.getElementById(
                "rejectedBookings"
            ).innerText = "0";


            document.getElementById(
                "completedBookings"
            ).innerText = "0";


            bookingList.innerHTML = `

                <div class="booking-card">

                    <p>
                        ❌ Failed to load bookings.
                    </p>

                    <p>
                        ${error.message}
                    </p>

                </div>

            `;

        }

    }


    // =================================================
    // DELETE BOOKING
    // =================================================

    async function deleteBooking(
        bookingId
    ) {


        const confirmDelete =
            confirm(
                "Are you sure you want to delete Booking #" +
                bookingId +
                "?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/rentals/id/${bookingId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const errorMessage =
                    await response.text();


                throw new Error(
                    errorMessage ||
                    "Delete failed"
                );

            }


            alert(
                "Booking deleted successfully! ✅"
            );


            // Refresh list and counts

            loadBookings();

        }


        catch (error) {

            console.error(
                "Delete Error:",
                error
            );


            alert(
                "Failed to delete booking!\n\n" +
                error.message
            );

        }

    }


    // =================================================
    // BACK TO ADMIN DASHBOARD
    // =================================================

    function goBack() {

        window.location.href =
            "admin.html";

    }


    // =================================================
    // INITIAL LOAD
    // =================================================

    loadBookings();

</script>


</body>

</html>
