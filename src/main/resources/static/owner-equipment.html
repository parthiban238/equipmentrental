<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Equipment</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7f4;
        }

        header {
            background-color: #1565c0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .equipment-card {
            background-color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .equipment-card h3 {
            color: #1565c0;
            margin-top: 0;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            color: white;
            font-size: 14px;
        }

        .delete-btn {
            background-color: #d32f2f;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        .back-btn {
            background-color: #555;
        }

        .back-btn:hover {
            background-color: #333;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>


<header>

    <h1>🚜 My Equipment</h1>

</header>


<div class="container">


    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Owner Dashboard

    </button>


    <h2>My Equipment List</h2>


    <div id="equipmentList">

        <p class="loading">
            Loading equipment...
        </p>

    </div>


</div>


<script>


const API_URL =
    "https://equipmentrental-1.onrender.com";

// ========================================
// Get Logged-in Owner ID
// ========================================

const ownerId = localStorage.getItem("userId");


// ========================================
// Check Login
// ========================================

if (!ownerId) {

    alert("Please login first.");

    window.location.href = "login.html";

}


// ========================================
// Load Owner Equipment
// ========================================

async function loadEquipment() {

    const equipmentList =
        document.getElementById("equipmentList");


    equipmentList.innerHTML = `
        <p class="loading">
            Loading equipment...
        </p>
    `;


    try {

        const response = await fetch(
            `${API_URL}/api/equipment/owner/${ownerId}`
        );


        if (!response.ok) {

            throw new Error(
                "Failed to load equipment"
            );

        }


        const equipment =
            await response.json();


        console.log(
            "Owner Equipment:",
            equipment
        );


        equipmentList.innerHTML = "";


        // ========================================
        // No Equipment
        // ========================================

        if (
            !equipment ||
            equipment.length === 0
        ) {

            equipmentList.innerHTML = `

                <div class="equipment-card empty">

                    <h3>📦 No Equipment Found</h3>

                    <p>
                        You have not added any equipment yet.
                    </p>

                    <p>
                        Add equipment from Owner Dashboard.
                    </p>

                </div>

            `;

            return;

        }


        // ========================================
        // Display Equipment
        // ========================================

        equipment.forEach(function(item) {


            const card =
                document.createElement("div");


            card.className =
                "equipment-card";


            const available =
                item.available === true;


            card.innerHTML = `

                <h3>
                    🚜 ${item.name}
                </h3>


                <p>
                    <strong>ID:</strong>
                    ${item.id}
                </p>


                <p>
                    <strong>Category:</strong>
                    ${item.category}
                </p>


                <p>
                    <strong>Location:</strong>
                    ${item.location}
                </p>


                <p>
                    <strong>Price:</strong>
                    ₹${item.pricePerDay}
                    / day
                </p>


                <p>
                    <strong>Status:</strong>

                    <span class="${
                        available
                            ? "available"
                            : "unavailable"
                    }">

                        ${
                            available
                                ? "Available"
                                : "Not Available"
                        }

                    </span>

                </p>


                <button
                    class="delete-btn"
                    onclick="deleteEquipment(${item.id})">

                    🗑️ Delete

                </button>

            `;


            equipmentList.appendChild(card);

        });


    }


    catch (error) {

        console.error(
            "Equipment Error:",
            error
        );


        equipmentList.innerHTML = `

            <div class="equipment-card">

                <h3>❌ Error</h3>

                <p>
                    Failed to load equipment.
                </p>

                <p>
                    ${error.message}
                </p>

                <button
                    class="back-btn"
                    onclick="loadEquipment()">

                    🔄 Try Again

                </button>

            </div>

        `;

    }

}


// ========================================
// Delete Equipment
// ========================================

async function deleteEquipment(equipmentId) {


    const confirmDelete = confirm(

        "⚠️ Are you sure you want to delete this equipment?"

    );


    if (!confirmDelete) {

        return;

    }


    try {


        console.log(
            "Deleting Equipment ID:",
            equipmentId
        );


        // IMPORTANT:
        // Backend endpoint is /id/{id}

        const response = await fetch(

            `${API_URL}/api/equipment/id/${equipmentId}`,

            {
                method: "DELETE"
            }

        );


        // ====================================
        // Delete Success
        // ====================================

        if (response.ok) {


            alert(
                "Equipment deleted successfully! ✅"
            );


            // Reload equipment list

            await loadEquipment();


            return;

        }


        // ====================================
        // Delete Failed
        // ====================================

        const errorMessage =
            await response.text();


        throw new Error(

            errorMessage ||
            `Delete failed (${response.status})`

        );


    }


    catch (error) {


        console.error(
            "Delete Error:",
            error
        );


        alert(

            "❌ Failed to delete equipment!\n\n" +
            error.message

        );

    }

}


// ========================================
// Back to Owner Dashboard
// ========================================

function goBack() {

    window.location.href =
        "owner.html";

}


// ========================================
// Load Page
// ========================================

loadEquipment();


</script>


</body>

</html>
