<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-section h2 {
            color: #2e7d32;
            margin: 0;
        }

        .back-btn {
            background: #555;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #333;
        }

        .booking-card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .booking-header h3 {
            margin: 0;
            color: #2e7d32;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detail-box {
            background: #f8f9f8;
            padding: 12px;
            border-radius: 7px;
        }

        .detail-box strong {
            display: block;
            color: #555;
            margin-bottom: 5px;
        }

        .detail-box span {
            color: #222;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .empty h3 {
            color: #2e7d32;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #555;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .refresh-btn {
            margin-top: 15px;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ==============================
           Rating Button
        ============================== */

        .rating-btn {
            margin-top: 18px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .rating-btn:hover {
            background: #e68900;
        }

        .reviewed {
            margin-top: 18px;
            padding: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 7px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .top-section {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .booking-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>📋 My Bookings</h1>

</header>


<div class="container">


    <div class="top-section">

        <h2>My Rental Bookings</h2>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Back to Dashboard

        </button>

    </div>


    <div id="bookingList">

        <div class="loading">

            Loading your bookings...

        </div>

    </div>


</div>



<script>


const API_URL = "http://localhost:8081";


// ==========================================
// Get logged-in user
// ==========================================

const userId =
    localStorage.getItem("userId");

const userRole =
    localStorage.getItem("userRole");


// ==========================================
// Check Login
// ==========================================

if (!userId) {

    alert("Please login first.");

    window.location.href =
        "login.html";
}


// ==========================================
// Check Farmer
// ==========================================

if (
    userRole &&
    userRole.toUpperCase() !== "FARMER"
) {

    alert("Farmer access required.");

    window.location.href =
        "login.html";
}


// ==========================================
// Load Farmer Bookings
// ==========================================

async function loadBookings() {

    const bookingList =
        document.getElementById("bookingList");


    bookingList.innerHTML = `

        <div class="loading">

            Loading your bookings...

        </div>

    `;


    try {

        const response = await fetch(

            `${API_URL}/api/rentals/user/${userId}`

        );


        if (!response.ok) {

            throw new Error(
                "Unable to fetch bookings"
            );

        }


        const bookings =
            await response.json();


        console.log(
            "Farmer Bookings:",
            bookings
        );


        // ==================================
        // No bookings
        // ==================================

        if (
            !bookings ||
            bookings.length === 0
        ) {

            bookingList.innerHTML = `

                <div class="empty">

                    <h3>📋 No Bookings Found</h3>

                    <p>
                        You have not booked any
                        agricultural equipment yet.
                    </p>

                    <button
                        class="refresh-btn"
                        onclick="goToEquipment()">

                        🚜 Browse Equipment

                    </button>

                </div>

            `;

            return;
        }


        bookingList.innerHTML = "";


        // ==================================
        // Display bookings
        // ==================================

        bookings.forEach(function(booking) {


            const card =
                document.createElement("div");


            card.className =
                "booking-card";


            // ==============================
            // Status
            // ==============================

            const status =
                String(
                    booking.status || "PENDING"
                ).toUpperCase();


            let statusClass =
                "pending";


            if (status === "APPROVED") {

                statusClass =
                    "approved";

            }
            else if (status === "REJECTED") {

                statusClass =
                    "rejected";

            }
            else if (status === "COMPLETED") {

                statusClass =
                    "completed";

            }


            // ==============================
            // Amount
            // ==============================

            const amount =
                booking.totalAmount != null

                ? "₹ " +
                  Number(
                      booking.totalAmount
                  ).toFixed(2)

                : "₹ 0.00";


            // ==============================
            // Rating button
            // ==============================

            let ratingSection = "";


            if (status === "COMPLETED") {

                ratingSection = `

                    <button
                        class="rating-btn"
                        onclick="
                            openRating(
                                ${booking.id},
                                ${booking.equipmentId}
                            )
                        ">

                        ⭐ Give Rating & Review

                    </button>

                `;

            }


            // ==============================
            // Card HTML
            // ==============================

            card.innerHTML = `

                <div class="booking-header">

                    <h3>
                        🚜 Booking #${booking.id}
                    </h3>

                    <span
                        class="status ${statusClass}">

                        ${status}

                    </span>

                </div>


                <div class="details">


                    <div class="detail-box">

                        <strong>
                            👨‍🌾 Farmer ID
                        </strong>

                        <span>
                            ${booking.userId}
                        </span>

                    </div>


                    <div class="detail-box">

                        <strong>
                            🚜 Equipment ID
                        </strong>

                        <span>
                            ${booking.equipmentId}
                        </span>

                    </div>


                    <div class="detail-box">

                        <strong>
                            📅 Start Date
                        </strong>

                        <span>
                            ${booking.startDate}
                        </span>

                    </div>


                    <div class="detail-box">

                        <strong>
                            📅 End Date
                        </strong>

                        <span>
                            ${booking.endDate}
                        </span>

                    </div>


                    <div class="detail-box">

                        <strong>
                            💰 Total Amount
                        </strong>

                        <span>
                            ${amount}
                        </span>

                    </div>


                    <div class="detail-box">

                        <strong>
                            📌 Booking Status
                        </strong>

                        <span>
                            ${status}
                        </span>

                    </div>


                </div>


                ${ratingSection}

            `;


            bookingList.appendChild(card);


        });


    }


    catch (error) {

        console.error(
            "Booking Error:",
            error
        );


        bookingList.innerHTML = `

            <div class="error">

                ❌ Failed to load bookings.

                <br><br>

                Please make sure Spring Boot
                backend is running.

                <br>

                <button
                    class="refresh-btn"
                    onclick="loadBookings()">

                    🔄 Try Again

                </button>

            </div>

        `;

    }

}



// ==========================================
// ⭐ Open Rating
// ==========================================

async function openRating(
    rentalId,
    equipmentId
) {


    // ==============================
    // Check if already reviewed
    // ==============================

    try {

        const checkResponse =
            await fetch(
                `${API_URL}/api/ratings/rental/${rentalId}`
            );


        if (checkResponse.ok) {

            alert(
                "⭐ You have already reviewed this rental."
            );

            return;

        }

    }
    catch (error) {

        console.log(
            "No previous rating found."
        );

    }


    // ==============================
    // Get rating
    // ==============================

    const rating =
        prompt(
            "⭐ Give rating from 1 to 5:"
        );


    if (rating === null) {

        return;

    }


    const ratingValue =
        Number(rating);


    // ==============================
    // Validate rating
    // ==============================

    if (
        !Number.isInteger(ratingValue) ||
        ratingValue < 1 ||
        ratingValue > 5
    ) {

        alert(
            "❌ Please enter a rating between 1 and 5."
        );

        return;

    }


    // ==============================
    // Get review
    // ==============================

    const review =
        prompt(
            "✍️ Write your review:"
        );


    if (review === null) {

        return;

    }


    // ==============================
    // Prepare data
    // ==============================

    const data = {

        rentalId:
            Number(rentalId),

        userId:
            Number(userId),

        equipmentId:
            Number(equipmentId),

        rating:
            ratingValue,

        review:
            review.trim()

    };


    // ==============================
    // Submit
    // ==============================

    try {

        const response =
            await fetch(

                `${API_URL}/api/ratings`,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }

            );


        const result =
            await response.text();


        if (!response.ok) {

            alert(
                "❌ " + result
            );

            return;

        }


        alert(
            "⭐ Rating & Review submitted successfully!"
        );


        // Reload bookings
        loadBookings();


    }
    catch (error) {

        console.error(
            "Rating Error:",
            error
        );


        alert(
            "❌ Failed to submit rating."
        );

    }

}



// ==========================================
// Back to Farmer Dashboard
// ==========================================

function goBack() {

    window.location.href =
        "farmer.html";

}



// ==========================================
// Browse Equipment
// ==========================================

function goToEquipment() {

    window.location.href =
        "equipment.html";

}



// ==========================================
// Load when page opens
// ==========================================

loadBookings();


</script>


</body>

</html>
