<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #6a1b9a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .user-card {
            background-color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .user-card h3 {
            color: #6a1b9a;
        }

        .delete-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        .back-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>

<header>

    <h1>👥 Manage Users</h1>

</header>


<div class="container">

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Admin Dashboard

    </button>


    <h2>Registered Users</h2>


    <div id="userList">

        <p>Loading users...</p>

    </div>

</div>


<script>

    const API_URL =
        "http://localhost:8081";


    // ==================================
    // Load Users
    // ==================================

    async function loadUsers() {

        const userList =
            document.getElementById("userList");


        try {

            const response =
                await fetch(
                    `${API_URL}/api/users`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load users"
                );

            }


            const users =
                await response.json();


            console.log(
                "Users:",
                users
            );


            userList.innerHTML = "";


            if (users.length === 0) {

                userList.innerHTML =
                    "<p>No users found.</p>";

                return;

            }


            users.forEach(function(user) {

                const card =
                    document.createElement("div");


                card.className =
                    "user-card";


                card.innerHTML = `

                    <h3>
                        👤 ${user.name}
                    </h3>

                    <p>
                        <strong>ID:</strong>
                        ${user.id}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${user.email}
                    </p>

                    <p>
                        <strong>Role:</strong>
                        ${user.role}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteUser(${user.id})">

                        🗑️ Delete User

                    </button>

                `;


                userList.appendChild(card);

            });

        }
        catch (error) {

            console.error(
                "User Error:",
                error
            );


            userList.innerHTML = `

                <p>
                    ❌ Backend connection failed.
                </p>

            `;

        }

    }


    // ==================================
    // Delete User
    // ==================================

    async function deleteUser(userId) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this user?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/users/${userId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const error =
                    await response.text();

                throw new Error(
                    error ||
                    "Failed to delete user"
                );

            }


            alert(
                "User deleted successfully! ✅"
            );


            loadUsers();

        }
        catch (error) {

            console.error(
                "Delete Error:",
                error
            );


            alert(
                "Failed to delete user.\n\n" +
                error.message
            );

        }

    }


    // ==================================
    // Back
    // ==================================

    function goBack() {

        window.location.href =
            "admin.html";

    }


    // Load users

    loadUsers();

</script>


</body>

</html>
