<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Equipment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        /* ================= HEADER ================= */

        header {
            background-color: #6a1b9a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        /* ================= BACK BUTTON ================= */

        .back-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .back-btn:hover {
            background-color: #333;
        }

        /* ================= STAT CARDS ================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            border-top: 5px solid #6a1b9a;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #6a1b9a;
            margin-bottom: 5px;
        }

        .stat-title {
            color: #666;
            font-size: 14px;
        }

        .available-stat {
            border-top-color: #2e7d32;
        }

        .available-stat .stat-number {
            color: #2e7d32;
        }

        .unavailable-stat {
            border-top-color: #d32f2f;
        }

        .unavailable-stat .stat-number {
            color: #d32f2f;
        }

        .category-stat {
            border-top-color: #ef6c00;
        }

        .category-stat .stat-number {
            color: #ef6c00;
        }

        /* ================= EQUIPMENT ================= */

        .equipment-card {
            background-color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .equipment-card h3 {
            color: #6a1b9a;
            margin-top: 0;
        }

        .equipment-card p {
            line-height: 1.5;
        }

        /* ================= DELETE ================= */

        .delete-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        /* ================= STATUS ================= */

        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                padding: 10px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <h1>🚜 Manage Equipment</h1>

</header>


<div class="container">


    <!-- ================= BACK ================= -->

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Admin Dashboard

    </button>


    <!-- ================================================= -->
    <!-- OVERALL COUNT CARDS -->
    <!-- ================================================= -->

    <div class="stats-grid">


        <!-- TOTAL -->

        <div class="stat-card">

            <div class="stat-icon">
                🚜
            </div>

            <div
                class="stat-number"
                id="totalEquipment">

                0

            </div>

            <div class="stat-title">
                Total Equipment
            </div>

        </div>


        <!-- AVAILABLE -->

        <div class="stat-card available-stat">

            <div class="stat-icon">
                ✅
            </div>

            <div
                class="stat-number"
                id="availableEquipment">

                0

            </div>

            <div class="stat-title">
                Available
            </div>

        </div>


        <!-- NOT AVAILABLE -->

        <div class="stat-card unavailable-stat">

            <div class="stat-icon">
                ❌
            </div>

            <div
                class="stat-number"
                id="unavailableEquipment">

                0

            </div>

            <div class="stat-title">
                Not Available
            </div>

        </div>


        <!-- CATEGORIES -->

        <div class="stat-card category-stat">

            <div class="stat-icon">
                📂
            </div>

            <div
                class="stat-number"
                id="categoryCount">

                0

            </div>

            <div class="stat-title">
                Categories
            </div>

        </div>

    </div>


    <!-- ================= EQUIPMENT TITLE ================= -->

    <h2>
        All Equipment
    </h2>


    <!-- ================= EQUIPMENT LIST ================= -->

    <div id="equipmentList">

        <p>
            Loading equipment...
        </p>

    </div>


</div>


<script>

    const API_URL =
    "https://equipmentrental-1.onrender.com";

    // =================================================
    // LOAD EQUIPMENT
    // =================================================

    async function loadEquipment() {

        const equipmentList =
            document.getElementById(
                "equipmentList"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/api/equipment`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load equipment"
                );

            }


            const equipment =
                await response.json();


            console.log(
                "Equipment:",
                equipment
            );


            // ==========================================
            // CALCULATE COUNTS
            // ==========================================

            const total =
                equipment.length;


            const available =
                equipment.filter(
                    item => item.available === true
                ).length;


            const unavailable =
                equipment.filter(
                    item => item.available === false
                ).length;


            const categories =
                new Set(
                    equipment
                        .map(item => item.category)
                        .filter(category => category)
                );


            // ==========================================
            // DISPLAY COUNTS
            // ==========================================

            document.getElementById(
                "totalEquipment"
            ).innerText =
                total;


            document.getElementById(
                "availableEquipment"
            ).innerText =
                available;


            document.getElementById(
                "unavailableEquipment"
            ).innerText =
                unavailable;


            document.getElementById(
                "categoryCount"
            ).innerText =
                categories.size;


            // ==========================================
            // EQUIPMENT LIST
            // ==========================================

            equipmentList.innerHTML = "";


            if (equipment.length === 0) {

                equipmentList.innerHTML =
                    "<p>No equipment found.</p>";

                return;

            }


            equipment.forEach(function(item) {


                const card =
                    document.createElement("div");


                card.className =
                    "equipment-card";


                const status =
                    item.available
                    ? "Available"
                    : "Not Available";


                const statusClass =
                    item.available
                    ? "available"
                    : "unavailable";


                card.innerHTML = `

                    <h3>
                        🚜 ${item.name}
                    </h3>

                    <p>
                        <strong>ID:</strong>
                        ${item.id}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${item.category}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${item.location}
                    </p>

                    <p>
                        <strong>Owner ID:</strong>
                        ${item.ownerId}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        ₹${item.pricePerDay} / day
                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span class="${statusClass}">
                            ${status}
                        </span>

                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteEquipment(${item.id})">

                        🗑️ Delete Equipment

                    </button>

                `;


                equipmentList.appendChild(card);

            });

        }

        catch (error) {

            console.error(
                "Equipment Error:",
                error
            );


            equipmentList.innerHTML = `

                <p>
                    ❌ Backend connection failed.
                </p>

            `;


            // Reset counters

            document.getElementById(
                "totalEquipment"
            ).innerText = "0";


            document.getElementById(
                "availableEquipment"
            ).innerText = "0";


            document.getElementById(
                "unavailableEquipment"
            ).innerText = "0";


            document.getElementById(
                "categoryCount"
            ).innerText = "0";

        }

    }


    // =================================================
    // DELETE EQUIPMENT
    // =================================================

    async function deleteEquipment(
        equipmentId
    ) {


        const confirmDelete =
            confirm(
                "Are you sure you want to delete this equipment?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/equipment/${equipmentId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const error =
                    await response.text();


                throw new Error(
                    error ||
                    "Failed to delete equipment"
                );

            }


            alert(
                "Equipment deleted successfully! ✅"
            );


            // Reload list + counts

            loadEquipment();

        }

        catch (error) {

            console.error(
                "Delete Error:",
                error
            );


            alert(
                "Failed to delete equipment.\n\n" +
                error.message
            );

        }

    }


    // =================================================
    // BACK
    // =================================================

    function goBack() {

        window.location.href =
            "admin.html";

    }


    // =================================================
    // INITIAL LOAD
    // =================================================

    loadEquipment();

</script>


</body>

</html>
