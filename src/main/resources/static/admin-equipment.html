<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Equipment</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #6a1b9a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .equipment-card {
            background-color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .equipment-card h3 {
            color: #6a1b9a;
        }

        .delete-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        .back-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>

<header>

    <h1>🚜 Manage Equipment</h1>

</header>


<div class="container">

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Admin Dashboard

    </button>


    <h2>All Equipment</h2>


    <div id="equipmentList">

        <p>Loading equipment...</p>

    </div>

</div>


<script>

    const API_URL =
        "http://localhost:8081";


    // ================================
    // Load Equipment
    // ================================

    async function loadEquipment() {

        const equipmentList =
            document.getElementById(
                "equipmentList"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/api/equipment`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load equipment"
                );

            }


            const equipment =
                await response.json();


            console.log(
                "Equipment:",
                equipment
            );


            equipmentList.innerHTML = "";


            if (equipment.length === 0) {

                equipmentList.innerHTML =
                    "<p>No equipment found.</p>";

                return;

            }


            equipment.forEach(function(item) {

                const card =
                    document.createElement("div");


                card.className =
                    "equipment-card";


                const status =
                    item.available
                    ? "Available"
                    : "Not Available";


                const statusClass =
                    item.available
                    ? "available"
                    : "unavailable";


                card.innerHTML = `

                    <h3>
                        🚜 ${item.name}
                    </h3>

                    <p>
                        <strong>ID:</strong>
                        ${item.id}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${item.category}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${item.location}
                    </p>

                    <p>
                        <strong>Owner ID:</strong>
                        ${item.ownerId}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        ₹${item.pricePerDay} / day
                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span class="${statusClass}">
                            ${status}
                        </span>

                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteEquipment(${item.id})">

                        🗑️ Delete Equipment

                    </button>

                `;


                equipmentList.appendChild(card);

            });

        }
        catch (error) {

            console.error(
                "Equipment Error:",
                error
            );


            equipmentList.innerHTML = `

                <p>
                    ❌ Backend connection failed.
                </p>

            `;

        }

    }


    // ================================
    // Delete Equipment
    // ================================

    async function deleteEquipment(
        equipmentId
    ) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this equipment?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/equipment/${equipmentId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const error =
                    await response.text();

                throw new Error(
                    error ||
                    "Failed to delete equipment"
                );

            }


            alert(
                "Equipment deleted successfully! ✅"
            );


            loadEquipment();

        }
        catch (error) {

            console.error(
                "Delete Error:",
                error
            );


            alert(
                "Failed to delete equipment.\n\n" +
                error.message
            );

        }

    }


    // ================================
    // Back
    // ================================

    function goBack() {

        window.location.href =
            "admin.html";

    }


    // Load equipment

    loadEquipment();

</script>


</body>

</html>
