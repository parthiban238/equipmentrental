<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Complaints - Agricultural Equipment Rental</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #f4f7f4;

            color: #333;

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(
                135deg,
                #1b5e20,
                #2e7d32
            );

            color: white;

            padding: 18px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.15);

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        header h1 {
            font-size: 24px;
        }


        nav {
            display: flex;

            gap: 8px;

            align-items: center;

            flex-wrap: wrap;
        }


        nav a {
            color: white;

            text-decoration: none;

            padding: 9px 13px;

            border-radius: 6px;

            font-size: 14px;

            transition: 0.3s;
        }


        nav a:hover {
            background:
                rgba(255, 255, 255, 0.18);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1250px;

            margin: auto;

            padding: 35px 20px 50px;
        }


        .page-title {
            text-align: center;

            margin-bottom: 25px;
        }


        .page-title h2 {
            color: #1b5e20;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .page-title p {
            color: #666;

            font-size: 15px;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            background: white;

            padding: 18px 20px;

            border-radius: 10px;

            margin-bottom: 25px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.07);
        }


        .complaint-count {
            font-size: 16px;

            font-weight: bold;

            color: #1b5e20;
        }


        .refresh-btn {
            border: none;

            background: #2e7d32;

            color: white;

            padding: 10px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;

            font-size: 14px;
        }


        .refresh-btn:hover {
            background: #1b5e20;
        }


        /* =========================
           COMPLAINT GRID
        ========================= */

        #complaintList {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(350px, 1fr)
                );

            gap: 22px;
        }


        /* =========================
           COMPLAINT CARD
        ========================= */

        .complaint-card {
            background: white;

            border-radius: 14px;

            padding: 22px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

            border: 1px solid #e3e9e3;

            transition: 0.3s;
        }


        .complaint-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.12);
        }


        .complaint-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding-bottom: 15px;

            margin-bottom: 18px;

            border-bottom:
                1px solid #eeeeee;
        }


        .complaint-header h3 {
            color: #1b5e20;

            font-size: 19px;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 7px 12px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;

            white-space: nowrap;
        }


        .status-pending {
            background: #fff3cd;

            color: #856404;
        }


        .status-under-review {
            background: #cfe2ff;

            color: #084298;
        }


        .status-resolved {
            background: #d1e7dd;

            color: #0f5132;
        }


        .status-rejected {
            background: #f8d7da;

            color: #842029;
        }


        /* =========================
           DETAILS
        ========================= */

        .details {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-bottom: 18px;
        }


        .detail-box {
            background: #f7faf7;

            padding: 11px;

            border-radius: 8px;
        }


        .detail-box strong {
            display: block;

            color: #666;

            font-size: 11px;

            margin-bottom: 5px;
        }


        .detail-box span {
            font-size: 14px;

            font-weight: 600;

            color: #222;

            word-break: break-word;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description-box {
            background: #f9faf9;

            border-left:
                4px solid #2e7d32;

            padding: 13px;

            border-radius: 6px;

            margin-bottom: 18px;
        }


        .description-box strong {
            display: block;

            color: #555;

            font-size: 13px;

            margin-bottom: 6px;
        }


        .description-box p {
            font-size: 14px;

            line-height: 1.5;

            color: #333;
        }


        /* =========================
           COMPLAINT TYPE
        ========================= */

        .complaint-type {
            display: inline-block;

            background: #e8f5e9;

            color: #1b5e20;

            padding: 7px 10px;

            border-radius: 6px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        /* =========================
           PHOTO
        ========================= */

        .photo-box {
            background: #f5f5f5;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            font-size: 13px;
        }


        /* =========================
           STATUS CONTROL
        ========================= */

        .status-control {
            border-top:
                1px solid #eeeeee;

            padding-top: 18px;
        }


        .status-control label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;

            color: #555;
        }


        .status-control select {
            width: 100%;

            padding: 11px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            background: white;

            font-size: 14px;

            outline: none;
        }


        .status-control select:focus {
            border-color: #2e7d32;
        }


        .update-btn {
            width: 100%;

            margin-top: 10px;

            border: none;

            background: #2e7d32;

            color: white;

            padding: 11px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }


        .update-btn:hover {
            background: #1b5e20;
        }


        .update-btn:disabled {
            background: #999;

            cursor: not-allowed;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            grid-column: 1 / -1;

            background: white;

            border-radius: 12px;

            text-align: center;

            padding: 60px 20px;

            color: #555;

            font-size: 18px;
        }


        .loading::before {
            content: "⏳";

            display: block;

            font-size: 40px;

            margin-bottom: 12px;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            grid-column: 1 / -1;

            background: white;

            border-radius: 12px;

            text-align: center;

            padding: 60px 20px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.07);
        }


        .empty h3 {
            color: #1b5e20;

            margin-bottom: 10px;
        }


        .empty p {
            color: #666;

            font-size: 14px;
        }


        /* =========================
           ERROR
        ========================= */

        .error {
            grid-column: 1 / -1;

            background: white;

            border:
                1px solid #f5c6cb;

            color: #721c24;

            padding: 40px 20px;

            text-align: center;

            border-radius: 12px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #1b5e20;

            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 30px;
        }


        footer p {
            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            header {
                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }


            header h1 {
                font-size: 20px;

                text-align: center;
            }


            nav {
                justify-content: center;
            }


            .page-title h2 {
                font-size: 26px;
            }


            .top-bar {
                flex-direction: column;

                gap: 15px;

                align-items: stretch;
            }


            .refresh-btn {
                width: 100%;
            }


            #complaintList {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 480px) {

            main {
                padding: 25px 12px;
            }


            .details {
                grid-template-columns: 1fr;
            }


            .complaint-card {
                padding: 16px;
            }


            .complaint-header {
                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            🚜 Agricultural Equipment Rental
        </h1>


        <nav>

            <a href="owner.html">
                🏠 Dashboard
            </a>

            <a href="owner-equipment.html">
                🚜 My Equipment
            </a>

            <a href="owner-bookings.html">
                📋 Bookings
            </a>

            <a href="owner-complaints.html">
                📢 Complaints
            </a>

            <a href="login.html">
                🚪 Logout
            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <div class="page-title">

            <h2>
                📢 Customer Complaints
            </h2>

            <p>
                Review and manage complaints
                reported by farmers for your equipment.
            </p>

        </div>



        <!-- TOP BAR -->

        <div class="top-bar">

            <div
                class="complaint-count"
                id="complaintCount">

                Complaints: 0

            </div>


            <button
                class="refresh-btn"
                onclick="loadComplaints()">

                🔄 Refresh Complaints

            </button>

        </div>



        <!-- COMPLAINT LIST -->

        <div id="complaintList">

            <div class="loading">

                Loading complaints...

            </div>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Agricultural Equipment Rental Marketplace
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="owner-complaints.js"></script>


</body>

</html>
